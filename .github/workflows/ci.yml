name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: garquinsfilm_auth_test
          POSTGRES_USER: gf_test
          POSTGRES_PASSWORD: gf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gf_test -d garquinsfilm_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/garquinsfilm?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @garquinsfilm/api prisma:validate

      - name: Generate Prisma Client
        run: pnpm --filter @garquinsfilm/api prisma:generate

      - name: Apply migrations to isolated test database
        run: pnpm --filter @garquinsfilm/api db:migrate:deploy
        env:
          DATABASE_URL: postgresql://gf_test:gf_test@127.0.0.1:5432/garquinsfilm_auth_test?schema=public

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://gf_test:gf_test@127.0.0.1:5432/garquinsfilm_auth_test?schema=public
          AUTH_TEST_DATABASE_URL: postgresql://gf_test:gf_test@127.0.0.1:5432/garquinsfilm_auth_test?schema=public
          RUN_AUTH_INTEGRATION_TESTS: '1'
          RUN_LIBRARY_INTEGRATION_TESTS: '1'
          LIBRARY_TEST_DATABASE_URL: postgresql://gf_test:gf_test@127.0.0.1:5432/garquinsfilm_auth_test?schema=public
          RUN_DB_INTEGRATION_TESTS: '1'
          RUN_RATINGS_INTEGRATION_TESTS: '1'
          RATINGS_TEST_DATABASE_URL: postgresql://gf_test:gf_test@127.0.0.1:5432/garquinsfilm_auth_test?schema=public
          RUN_SEASON_PROGRESS_INTEGRATION_TESTS: '1'
          SEASON_PROGRESS_TEST_DATABASE_URL: postgresql://gf_test:gf_test@127.0.0.1:5432/garquinsfilm_auth_test?schema=public
          BETTER_AUTH_SECRET: test-only-better-auth-secret-not-for-any-deployment
          BETTER_AUTH_URL: http://127.0.0.1:3001
          BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173

      - name: Build
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit
