name: garquinsfilm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - target: 5432
        published: ${POSTGRES_PORT:-5433}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - target: 8025
        published: ${MAILPIT_WEB_PORT:-8025}
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 1025
        published: ${MAILPIT_SMTP_PORT:-1025}
        host_ip: 127.0.0.1
        protocol: tcp

volumes:
  postgres_data:
